<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Memory Game | RS School</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="index.js"></script>
</head>
<body>

  <div class="archive-shell">
    
    <header class="archive-header">
      
      <div class="panel header-identity">
        <h1 class="header-title">MEMORY GAME</h1>
        <p class="header-subtitle">ROLLING SCOPES SCHOOL TASK</p>
      </div>

      <div class="panel header-stats">
        <div class="stats-label">STATS</div>
        <div class="stats-grid">
          <div class="stat-item"><span class="k">TIME:</span><br><span class="v" id="timerVal">00:00</span></div>
          <div class="stat-item"><span class="k">MOVES:</span><br><span class="v" id="movesVal">0</span></div>
          <div class="stat-item"><span class="k">MATCHES:</span><br><span class="v" id="matchesVal">0 / 8</span></div>
        </div>
      </div>

      <div class="panel header-actions">
        <button class="action-btn" id="btnRestart" title="Restart Game">
          <svg viewBox="0 0 24 24" class="btn-icon"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          <span>RESTART</span>
        </button>
        <button class="action-btn" id="btnScores" title="Leaderboard">
          <svg viewBox="0 0 24 24" class="btn-icon"><path d="M4 11h4v8H4zm6-5h4v13h-4zm6 8h4v5h-4z"/></svg>
          <span>SCORES</span>
        </button>

      </div>

    </header>

    <main class="archive-main">
      <div class="board-frame">
        <section class="game-board" id="gameBoard" aria-label="Card Grid"></section>
      </div>
    </main>

    <footer class="archive-footer">
      <div class="footer-col">MADE BY <a href="https://github.com/mejsler" target="_blank">MEJSLER</a></div>
      <div class="footer-col text-right">Full-Stack JS 2026 Q3</div>
    </footer>

  </div>

</body>
</html>
